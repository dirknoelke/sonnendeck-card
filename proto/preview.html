<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Sonnendeck preview</title>
<style>
  html,body{margin:0;background:#fff;font-family:Roboto,system-ui,sans-serif}
  .wrap{width:620px}
</style>
<script type="module" src="../dist/sonnendeck-card.js"></script>
</head><body>
<div class="wrap"><sonnendeck-card id="c"></sonnendeck-card></div>
<script type="module">
const p = new URLSearchParams(location.search);
const num = (v, u = 'W') => ({ state: String(v), attributes: { unit_of_measurement: u } });

const states = {
  'sensor.dach_pv1': num(480), 'sensor.dach_pv2': num(455),
  'sensor.dach_pv3': num(410), 'sensor.dach_pv4': num(390),
  'sensor.dach_soc': num(62, '%'), 'sensor.dach_bat': num(540),
  'sensor.dach_out': num(1100),

  'sensor.garten_pv1': num(320), 'sensor.garten_pv2': num(305),
  'sensor.garten_pv3': num(300), 'sensor.garten_pv4': num(285),
  'sensor.garten_soc': num(48, '%'), 'sensor.garten_bat': num(300),
  'sensor.garten_out': num(800),

  'sensor.sml_in': num(420), 'sensor.sml_out': num(0),
  'sensor.wallbox': num(1400),
};

const card = document.getElementById('c');
// ?n=1..4 systems, ?dock for one combined dock, ?noev without wallbox, ?idle for a sleeping car
const n = Math.min(4, Math.max(1, Number(p.get('n') ?? 2)));
const names = ['Dach', 'Garten', 'Carport', 'Scheune'];
const systems = names.slice(0, n).map((name, i) => {
  const k = ['dach', 'garten', 'carport', 'scheune'][i];
  if (i >= 2) {
    [480, 120, 360, 0].forEach((w, j) => (states[`sensor.${k}_pv${j + 1}`] = num(w)));
    states[`sensor.${k}_soc`] = num(30 + i * 20, '%');
    states[`sensor.${k}_bat`] = num(200);
    states[`sensor.${k}_out`] = num(500);
  }
  return { name, entities: {
    solar_1: `sensor.${k}_pv1`, solar_2: `sensor.${k}_pv2`,
    solar_3: `sensor.${k}_pv3`, solar_4: `sensor.${k}_pv4`,
    battery_soc: `sensor.${k}_soc`, battery_power: `sensor.${k}_bat`,
    output: `sensor.${k}_out` } };
});
if (p.has('idle')) states['sensor.wallbox'] = num(0);
if (p.has('export')) { states['sensor.sml_in'] = num(0); states['sensor.sml_out'] = num(1350); }
if (p.has('nogrid')) { states['sensor.sml_in'] = num(0); states['sensor.sml_out'] = num(0); }
if (p.has('sun')) states['sun.sun'] = { state: p.get('sun'), attributes: {} };
card.setConfig({
  type: 'custom:sonnendeck-card',
  title: 'Solaranlagen',
  systems,
  ...(p.has('dock') ? { storage_display: 'combined' } : {}),
  house: { grid_import: 'sensor.sml_in', grid_export: 'sensor.sml_out' },
  ...(p.has('noev') ? {} : { wallbox: { power: 'sensor.wallbox' } }),
  ...(p.has('tap') ? { corners: { solar: { tap_action: { action: 'navigate', navigation_path: '#solar' } }, grid: { tap_action: { action: 'none' } } } } : {}),
});
card.hass = {
  states,
  locale: { language: 'de' },
  themes: { darkMode: p.has('dark') },
};
if (p.has('sheet')) card.openDetails(p.get('sheet'));
if (p.has('details')) {
  const d = document.createElement('sonnendeck-details');
  d.style.cssText = 'display:block;max-width:460px;margin:16px';
  d.setConfig({ ...card._config, view: p.get('details') || 'all' });
  d.hass = card.hass;
  document.querySelector('.wrap').after(d);
}
</script>
</body></html>
